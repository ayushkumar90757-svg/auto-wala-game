name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Auto Wala APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Auto-Wala-Indian-City-Life.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Auto-Wala-Indian-City-Life-v1.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Wala-Indian-City-Life-APK
          path: Auto-Wala-Indian-City-Life.apk
          retention-days: 14

      - name: Publish v1.2.0 Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "Auto Wala: Indian City Life v1.2.0 (Android APK)"
          draft: false
          prerelease: false
          body: |
            ### 🛺 AUTO WALA: Indian City Life - Version 1.2.0 (Latest Release)

            **Key Improvements & Upgrades in v1.2.0:**
            - 🏎️ **Performance Boost & Graphics Settings:** Added Low, Medium, and High graphics presets with adaptive DPR and shadow cascade scaling. Throttled minimap drawing to eliminate 66% canvas overhead.
            - 🔄 **Fixed Steering Inversion & Input Delay:** Steering left turns Left, steering right turns Right across keyboard and touch. Steering lag reduced from 350ms to instantaneous response.
            - 🚦 **Clear Traffic Light HUD & Stop Lines:** Enlarged 3D traffic light lenses with emissive glow, added physical stop lines on road approaches, and integrated real-time HUD signal indicators, distance countdowns, and brake warnings.
            - 🚉 **Central Railway Station & Auto Stand:** Modeled a 64m colonial red sandstone station with clock tower, platform boards (Platform 1/2), train tracks, concourse benches, and dedicated Auto Rickshaw Stand & Pre-paid Booth.
            - 🎮 **Upgraded Driving Controls:** Clear mutual exclusivity between accelerator and brake/reverse with distinct green and red buttons.
            - 🎯 **Railway Missions & Payouts:** Added railway commuter pickups and dynamic HUD station arrival banners.

            **How to Install on Android:**
            1. Download `Auto-Wala-Indian-City-Life.apk` below.
            2. Tap the downloaded file on your Android device.
            3. If prompted, allow "Install unknown apps" in Settings.
            4. Launch and drive!
          files: |
            Auto-Wala-Indian-City-Life.apk
            Auto-Wala-Indian-City-Life-v1.2.0.apk
