name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Auto Wala APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Auto-Wala-Indian-City-Life.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Auto-Wala-Indian-City-Life-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Wala-Indian-City-Life-APK
          path: Auto-Wala-Indian-City-Life.apk
          retention-days: 14

      - name: Publish v1.1.0 Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "Auto Wala: Indian City Life v1.1.0 (Android APK)"
          draft: false
          prerelease: false
          body: |
            ### 🛺 AUTO WALA: Indian City Life - Version 1.1.0 (Latest Release)

            **Key Improvements & Bug Fixes in v1.1.0:**
            - 🎺 **Horn Bug Fixed:** Horn never plays automatically or loops; only sounds when pressed and held.
            - 🚗 **Steering & Physics Fixed:** Inverted steering corrected; smooth 3-wheel leaning into turns.
            - 🚦 **AI Traffic Lane Spacing:** Vehicles now detect traffic ahead in the same lane and stop cleanly without stacking or overlapping.
            - 🎯 **HUD & Start Screen Fixed:** Stuck "120m" and arrow overlay removed from start menu; added dedicated **START GAME** button.
            - 📱 **Android Touch Controls:** Fast, non-blocking pointer events with zero stuck touch states.
            - 💥 **Crash & Game Over Screen:** Vehicle breakdown triggers repair and main menu options.

            **How to Install on Android:**
            1. Download `Auto-Wala-Indian-City-Life.apk` below.
            2. Tap the downloaded file on your Android device.
            3. If prompted, allow "Install unknown apps" in Settings.
            4. Launch and drive!
          files: |
            Auto-Wala-Indian-City-Life.apk
            Auto-Wala-Indian-City-Life-v1.1.0.apk
